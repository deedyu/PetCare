spring.datasource.url=jdbc:h2:mem:petcare;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS \"TEXT\" AS CLOB
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
petcare.notifications.scan=false
petcare.session.idle-seconds=1800
petcare.remember.days=30
petcare.remember.key=petcare-test-remember-key
petcare.photos.directory=build/petcare-test-photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-http-form-post-size=6MB
server.tomcat.max-swallow-size=6MB
# H2에서 admin 계정을 새로 만들 때만 사용한다. 운영 비밀번호가 아니다.
petcare.admin.initial-password=admin
