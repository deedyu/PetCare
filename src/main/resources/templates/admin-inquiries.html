<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-shell :: layout('문의 관리', '접수된 문의를 상태별로 확인하고 답변 화면으로 이동합니다.', 'inquiries', ~{::main})}">
<body>
<main>
  <div class="toolbar">
    <select class="select" data-inquiry-filter aria-label="문의 상태 필터">
      <option value="all">상태 전체</option>
      <option value="OPEN">접수</option>
      <option value="IN_PROGRESS">처리 중</option>
      <option value="ANSWERED">답변 완료</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>제목</th><th>작성자</th><th>접수일</th><th>처리 상태</th></tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(inquiries)}"><td colspan="4" class="empty">접수된 문의가 없습니다.</td></tr>
        <tr id="inquiryEmpty" hidden><td colspan="4" class="empty">선택한 상태의 문의가 없습니다.</td></tr>
        <tr th:each="inquiry : ${inquiries}" th:attr="data-inquiry=${inquiry.status.name()}">
          <td><a th:href="@{'/admin/inquiries/' + ${inquiry.id}}" th:text="${inquiry.title}">제목</a></td>
          <td th:text="${inquiry.author != null ? inquiry.author.name : '작성자 없음'}">작성자</td>
          <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
          <td>
            <span class="badge"
                  th:classappend="${inquiry.status.name() == 'ANSWERED'} ? ' badge-ok' : (${inquiry.status.name() == 'IN_PROGRESS'} ? ' badge-progress' : ' badge-wait')"
                  th:text="${inquiry.status.label}">접수</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
