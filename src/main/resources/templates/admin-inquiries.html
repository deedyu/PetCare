<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>문의 - 관리자</title>
  <style>
    * { box-sizing: border-box; }
    @media (max-width: 768px) { .wrap { margin: 12px; padding: 16px; } }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6f7f4; margin: 0; color: #243027; }
    .wrap { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; }
    a { color: #3d7a4a; margin-right: 12px; }
    .card { border: 1px solid #e4e8e1; border-radius: 12px; padding: 16px; margin: 12px 0; }
    ul { padding-left: 18px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>문의</h1>
  <p>
    <a href="/admin">회원</a>
    <a href="/admin/notices">공지</a>
  </p>
  <ul>
    <li th:each="inquiry : ${inquiries}">
      <a th:href="@{'/admin/inquiries/' + ${inquiry.id}}" th:text="${inquiry.title}">제목</a>
      <span th:text="${inquiry.status.label}">상태</span>
      <span th:text="${inquiry.author != null ? inquiry.author.name : '작성자 없음'}">작성자</span>
    </li>
  </ul>
  <p th:if="${#lists.isEmpty(inquiries)}">접수된 문의가 없습니다.</p>
</div>
</body>
</html>
