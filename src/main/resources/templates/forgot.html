<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - PetCare</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <strong>PetCare</strong>
                <span>반려동물 일정</span>
            </div>
        </div>
        <h1>비밀번호 재설정</h1>
        <p class="lead">가입할 때 받은 복구 코드가 있어야 비밀번호를 바꿀 수 있습니다. 아이디나 이름만으로는 재설정할 수 없습니다.</p>
        <div class="banner warn">복구 코드를 분실했다면 이 화면에서 비밀번호를 되돌릴 수 없습니다. 코드를 가진 경우에만 진행하세요.</div>
        <div th:if="${error}" class="banner error" th:text="${error}"></div>

        <form th:unless="${verified}" action="/forgot/verify" method="post" data-lock-submit>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="username">아이디
                <input class="field" type="text" id="username" name="username" required autocomplete="username" th:value="${username}">
            </label>
            <label for="recoveryCode">복구 코드
                <input class="field" type="text" id="recoveryCode" name="recoveryCode" required autocomplete="off" spellcheck="false">
            </label>
            <button class="btn btn-primary btn-block" type="submit">확인</button>
        </form>

        <form th:if="${verified}" action="/forgot/reset" method="post" data-lock-submit>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <p class="banner ok">복구 코드가 확인되었습니다. 새 비밀번호를 입력하세요.</p>
            <div th:if="${formError}" class="banner error" th:text="${formError}"></div>
            <label for="password">새 비밀번호
                <span class="secret-line">
                    <input class="field" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                    <button class="btn" type="button" data-toggle-secret="password">표시</button>
                </span>
                <span class="hint">8자 이상, 영문과 숫자를 포함해야 합니다.</span>
            </label>
            <label for="passwordConfirm">새 비밀번호 확인
                <span class="secret-line">
                    <input class="field" type="password" id="passwordConfirm" name="passwordConfirm" required minlength="8" autocomplete="new-password">
                    <button class="btn" type="button" data-toggle-secret="passwordConfirm">표시</button>
                </span>
                <span id="matchStatus"></span>
            </label>
            <button class="btn btn-primary btn-block" type="submit">비밀번호 변경</button>
        </form>
        <div class="auth-links">
            <a href="/login">로그인으로 돌아가기</a>
        </div>
    </section>
</main>
<script src="/js/auth.js"></script>
</body>
</html>
