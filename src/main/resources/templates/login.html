<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - PetCare</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <strong>PetCare</strong>
                <span>반려동물 일정</span>
            </div>
        </div>
        <h1>로그인</h1>
        <p class="lead">아이디와 비밀번호를 입력하세요.</p>

        <div th:if="${param.suspended}" class="banner error">정지된 계정입니다. 관리자에게 문의하세요.</div>
        <div th:if="${param.error}" class="banner error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.locked}" class="banner error">로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.</div>
        <div th:if="${param.reset}" class="banner warn">비밀번호가 변경되어 다시 로그인해야 합니다.</div>
        <div th:if="${param.logout}" class="banner ok">로그아웃되었습니다.</div>
        <div th:if="${param.idle}" class="banner warn">일정 시간 동안 사용하지 않아 로그아웃되었습니다.</div>

        <form action="/login" method="post" data-lock-submit>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="username">아이디
                <input class="field" type="text" id="username" name="username" required autofocus autocomplete="username">
            </label>
            <label for="password">비밀번호
                <span class="secret-line">
                    <input class="field" type="password" id="password" name="password" required autocomplete="current-password">
                    <button class="btn" type="button" data-toggle-secret="password">표시</button>
                </span>
            </label>
            <label class="check-line">
                <input type="checkbox" name="remember-me" value="on">
                <span>로그인 상태 유지</span>
            </label>
            <p class="hint">체크하면 브라우저를 닫아도 30일 동안 유지됩니다. 화면을 연 채 30분 동안 사용하지 않으면 로그아웃됩니다.</p>
            <button class="btn btn-primary btn-block" type="submit">로그인</button>
        </form>
        <div class="auth-links">
            <a href="/forgot">비밀번호를 잊으셨나요?</a>
            <a href="/register">회원가입</a>
        </div>
    </section>
</main>
<script src="/js/auth.js"></script>
</body>
</html>
