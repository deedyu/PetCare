<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('문의', '보낸 문의와 답변 상태를 확인합니다.', 'inquiries', ~{::main})}">
<body>
<main>
  <div class="page-actions">
    <a class="btn btn-primary" href="/inquiries/new">문의 작성</a>
  </div>
  <div class="stack" th:if="${!#lists.isEmpty(inquiries)}">
    <a class="card" th:each="inquiry : ${inquiries}" th:href="@{'/inquiries/' + ${inquiry.id}}" style="color:inherit;">
      <strong th:text="${inquiry.title}">제목</strong>
      <div class="meta">
        <span class="badge" th:classappend="${inquiry.status.name() == 'ANSWERED'} ? ' ok' : (${inquiry.status.name() == 'IN_PROGRESS'} ? ' warn' : '')" th:text="${inquiry.status.label}">상태</span>
        <span th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd')}">날짜</span>
      </div>
    </a>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(inquiries)}">
    <strong>작성한 문의가 없어요.</strong>
    서비스 이용 중 궁금한 점을 남길 수 있습니다.
    <div style="margin-top:10px;"><a class="btn btn-primary" href="/inquiries/new">문의 작성</a></div>
  </div>
</main>
</body>
</html>
