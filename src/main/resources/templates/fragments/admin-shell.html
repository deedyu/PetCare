<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, pageDescription, nav, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="idle-seconds" th:content="${idleSeconds}">
  <meta name="csrf-token" th:content="${_csrf.token}">
  <meta name="csrf-header" th:content="${_csrf.headerName}">
  <title th:text="${pageTitle} + ' · PetCare 관리자'">관리자</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body th:attr="data-page=${nav}">
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">P</div>
    <div>
      <strong>PetCare</strong>
      <span>관리자</span>
    </div>
  </div>
  <nav class="nav" aria-label="관리자 메뉴">
    <a href="/admin#dashboard" data-nav="dashboard" th:classappend="${nav == 'dashboard'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      <span>대시보드</span>
    </a>
    <a href="/admin#members" data-nav="members">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="3"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 4.13a3 3 0 0 1 0 5.75"></path></svg>
      <span>회원 관리</span>
    </a>
    <a href="/admin#pets" data-nav="pets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="8" r="2"></circle><circle cx="12" cy="6" r="2"></circle><circle cx="18" cy="8" r="2"></circle><path d="M8 14c1.2-2 6.8-2 8 0 1 1.6.2 4-4 4s-5-2.4-4-4z"></path></svg>
      <span>반려동물 관리</span>
    </a>
    <a href="/admin#schedules" data-nav="schedules">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>일정 관리</span>
    </a>
    <a href="/admin/notices" th:classappend="${nav == 'notices'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2V6a2 2 0 0 1 2-2z"></path></svg>
      <span>공지사항 관리</span>
    </a>
    <a href="/admin/inquiries" th:classappend="${nav == 'inquiries'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H8l-3 3z"></path></svg>
      <span>문의 관리</span>
    </a>
  </nav>
  <div class="sidebar-foot">
    <p class="who-name" th:text="${session.admin != null ? session.admin.name : '관리자'}">관리자</p>
    <p class="who-id" th:text="${session.admin != null ? session.admin.username : ''}">admin</p>
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-ghost btn-block">로그아웃</button>
    </form>
  </div>
</aside>
<div class="backdrop" id="backdrop" hidden></div>
<div class="shell">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="메뉴 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div>
        <h1 id="pageTitle" th:text="${pageTitle}">제목</h1>
        <p id="pageDesc" th:text="${pageDescription}">설명</p>
      </div>
    </div>
    <div class="profile">
      <div class="avatar" th:text="${session.admin != null ? #strings.substring(session.admin.name, 0, 1) : '관'}">관</div>
      <span th:text="${session.admin != null ? session.admin.name : '관리자'}">관리자</span>
    </div>
  </header>
  <div class="page" th:insert="${content}"></div>
</div>
<div class="modal" id="confirmModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">확인</h2>
    <p id="confirmText">이 작업을 진행할까요?</p>
    <div class="modal-actions">
      <button type="button" class="btn" data-close-modal>취소</button>
      <button type="button" class="btn btn-danger" id="confirmOk">진행</button>
    </div>
  </div>
</div>
<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/idle.js}"></script>
</body>
</html>
