<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, pageDescription, nav, content)" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="idle-seconds" th:content="${idleSeconds}">
  <meta name="csrf-token" th:content="${_csrf.token}">
  <meta name="csrf-header" th:content="${_csrf.headerName}">
  <title th:text="${pageTitle} + ' · PetCare'">PetCare</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">P</div>
    <div>
      <strong>PetCare</strong>
      <span>반려동물 일정</span>
    </div>
  </div>
  <nav class="nav" aria-label="메뉴">
    <a href="/" th:classappend="${nav == 'home'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"></path></svg>
      <span>홈</span>
    </a>
    <a href="/calendar" th:classappend="${nav == 'calendar'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>캘린더</span>
    </a>
    <a href="/pets" th:classappend="${nav == 'pets'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="8" r="2"></circle><circle cx="12" cy="6" r="2"></circle><circle cx="18" cy="8" r="2"></circle><path d="M8 14c1.2-2 6.8-2 8 0 1 1.6.2 4-4 4s-5-2.4-4-4z"></path></svg>
      <span>반려동물</span>
    </a>
    <a href="/family" th:classappend="${nav == 'family'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="3"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 4.13a3 3 0 0 1 0 5.75"></path></svg>
      <span>가족</span>
    </a>
    <a href="/pets#health" th:classappend="${nav == 'health'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10z"></path></svg>
      <span>건강 기록</span>
    </a>
    <a href="/notifications" th:classappend="${nav == 'notifications'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l1.5 2H4.5z"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg>
      <span>알림</span>
      <span class="nav-count" th:if="${navUnread != null and navUnread > 0}" th:text="${navUnread}">1</span>
    </a>
    <a href="/inquiries" th:classappend="${nav == 'inquiries'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H8l-3 3z"></path></svg>
      <span>문의</span>
    </a>
    <a href="/mypage" th:classappend="${nav == 'account'} ? ' is-active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"></circle><path d="M5 19a7 7 0 0 1 14 0"></path></svg>
      <span>마이페이지</span>
    </a>
  </nav>
  <div class="sidebar-foot">
    <div class="who">
      <div class="avatar" th:text="${session.user != null and session.user.name != null and !#strings.isEmpty(session.user.name) ? #strings.substring(session.user.name, 0, 1) : 'P'}">P</div>
      <div>
        <p class="who-name" th:text="${session.user != null ? session.user.name : '회원'}">회원</p>
        <p class="who-id" th:text="${session.user != null ? session.user.username : ''}">id</p>
      </div>
    </div>
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-ghost btn-block">로그아웃</button>
    </form>
  </div>
</aside>
<div class="backdrop" id="backdrop" hidden></div>
<div class="shell">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="메뉴 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div>
        <h1 th:text="${pageTitle}">제목</h1>
        <p th:text="${pageDescription}">설명</p>
      </div>
    </div>
  </header>
  <div class="page" th:insert="${content}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/idle.js}"></script>
</html>
