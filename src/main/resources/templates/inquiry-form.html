<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('문의 작성', '제목과 내용을 보내면 관리자가 답변합니다.', 'inquiries', ~{::main})}">
<body>
<main>
  <div class="banner error" th:if="${param.error}">제목과 내용을 입력하세요.</div>
  <form class="card form-grid" th:action="@{/inquiries}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label class="block">제목
      <input class="field" type="text" name="title" maxlength="120" required>
    </label>
    <label class="block">내용
      <textarea class="field" name="body" maxlength="2000" rows="6" required></textarea>
    </label>
    <div class="row-actions">
      <button class="btn btn-primary" type="submit">보내기</button>
      <a class="btn" href="/inquiries">취소</a>
    </div>
  </form>
</main>
</body>
</html>
