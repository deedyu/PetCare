<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('반려동물 수정', '프로필 표시와 기본 정보를 바꿉니다.', 'pets', ~{::main})}">
<body>
<main>
  <div class="banner error" th:if="${error}" th:text="${error}">오류</div>
  <div class="banner ok" th:if="${success}" th:text="${success}">저장</div>
  <div th:replace="~{fragments/pet-form :: editor(${pet})}"></div>
</main>
</body>
</html>
