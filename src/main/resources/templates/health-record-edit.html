<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('건강 기록 수정', '기록 내용을 고칩니다.', 'health', ~{::main})}">
<body>
<main>
  <form class="card form-grid" th:action="@{'/pets/' + ${pet.id} + '/health/' + ${record.id} + '/update'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label class="block">제목
      <input class="field" type="text" name="title" th:value="${record.title}" required>
    </label>
    <label class="block">날짜
      <input class="field" type="date" name="recordDate" th:value="${record.recordDate}" required>
    </label>
    <label class="block">체중 (kg)
      <input class="field" type="number" name="weight" step="0.1" min="0" th:value="${record.weight}">
    </label>
    <label class="block">예방접종 종류
      <input class="field" type="text" name="vaccinationType" th:value="${record.vaccinationType}">
    </label>
    <label class="block">다음 접종일
      <input class="field" type="date" name="nextDueDate" th:value="${record.nextDueDate}">
    </label>
    <label class="block">병원 이름
      <input class="field" type="text" name="hospitalName" th:value="${record.hospitalName}">
    </label>
    <label class="block">약 이름
      <input class="field" type="text" name="medicationName" th:value="${record.medicationName}">
    </label>
    <label class="block">복용량
      <input class="field" type="text" name="medicationDosage" th:value="${record.medicationDosage}">
    </label>
    <label class="block">상세 설명
      <textarea class="field" name="description" th:text="${record.description}"></textarea>
    </label>
    <div class="row-actions">
      <button class="btn btn-primary" type="submit">저장</button>
      <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health'}">취소</a>
    </div>
  </form>
</main>
</body>
</html>
