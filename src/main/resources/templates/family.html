<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가족 - PetCare</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6f7f4; margin: 0; color: #243027; }
    .wrap { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; }
    a { color: #3d7a4a; }
    h1 { margin-top: 0; }
    .card { border: 1px solid #e4e8e1; border-radius: 12px; padding: 16px; margin: 12px 0; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    input, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #d5ddd4; }
    button { background: #3d7a4a; color: white; border: 0; cursor: pointer; }
    .error { color: #b42318; }
    ul { padding-left: 18px; }
    input, button { max-width: 100%; }
    @media (max-width: 768px) {
      .wrap { margin: 12px; padding: 16px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>가족</h1>
    <a href="/">홈으로</a>
  </header>
  <p class="error" th:if="${error}" th:text="${error}">오류</p>

  <div class="card">
    <h2>내 가족</h2>
    <ul>
      <li th:each="family : ${families}">
        <a th:href="@{'/family/' + ${family.id}}" th:text="${family.name}">가족</a>
      </li>
    </ul>
    <p th:if="${#lists.isEmpty(families)}">참여 중인 가족이 없습니다.</p>
  </div>

  <div class="card">
    <h2>가족 만들기</h2>
    <form th:action="@{/family}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label>이름 <input type="text" name="name" required maxlength="80"></label>
      <label>설명 <input type="text" name="description" maxlength="500"></label>
      <button type="submit">만들기</button>
    </form>
  </div>

  <div class="card">
    <h2>초대 코드로 참여</h2>
    <form th:action="@{/family/join}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label>코드 <input type="text" name="code" required maxlength="12"></label>
      <button type="submit">참여</button>
    </form>
  </div>
</div>
</body>
</html>
