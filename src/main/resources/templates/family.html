<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('가족', '함께 볼 가족과 초대 코드를 관리합니다.', 'family', ~{::main})}">
<body>
<main class="stack">
  <div class="banner error" th:if="${error}" th:text="${error}">오류</div>
  <section class="card">
    <h2>내 가족</h2>
    <ul class="list" th:if="${!#lists.isEmpty(families)}">
      <li th:each="family : ${families}">
        <a th:href="@{'/family/' + ${family.id}}" th:text="${family.name}">가족</a>
      </li>
    </ul>
    <div class="empty" th:if="${#lists.isEmpty(families)}">
      <strong>참여 중인 가족이 없어요.</strong>
      가족을 만들거나, 받은 초대 코드로 참여할 수 있습니다.
    </div>
  </section>
  <section class="card">
    <h2>가족 만들기</h2>
    <form class="form-grid" th:action="@{/family}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label class="block">이름 <input class="field" type="text" name="name" required maxlength="80"></label>
      <label class="block">설명 <input class="field" type="text" name="description" maxlength="500"></label>
      <button class="btn btn-primary" type="submit">만들기</button>
    </form>
  </section>
  <section class="card">
    <h2>초대 코드로 참여</h2>
    <form class="inline-form" th:action="@{/family/join}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input class="field" type="text" name="code" required maxlength="12" placeholder="초대 코드" aria-label="초대 코드">
      <button class="btn btn-primary" type="submit">참여</button>
    </form>
  </section>
</main>
</body>
</html>
