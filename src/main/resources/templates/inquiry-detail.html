<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>문의 - PetCare</title>
  <style>
    * { box-sizing: border-box; }
    @media (max-width: 768px) { .wrap { margin: 12px; padding: 16px; } }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6f7f4; margin: 0; color: #243027; }
    .wrap { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; }
    a { color: #3d7a4a; }
    .card { border: 1px solid #e4e8e1; border-radius: 12px; padding: 16px; margin: 12px 0; }
    p { white-space: pre-wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <p><a href="/inquiries">목록</a></p>
  <h1 th:text="${inquiry.title}">제목</h1>
  <p th:text="${inquiry.status.label}">상태</p>
  <p th:text="${inquiry.body}">내용</p>
  <div class="card" th:each="reply : ${replies}">
    <strong th:text="${reply.author != null ? reply.author.name : '관리자'}">관리자</strong>
    <p th:text="${reply.body}">답변</p>
  </div>
  <p th:if="${#lists.isEmpty(replies)}">아직 답변이 없습니다.</p>
</div>
</body>
</html>
