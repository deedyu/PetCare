<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('문의 상세', '답변이 달리면 여기에 표시됩니다.', 'inquiries', ~{::main})}">
<body>
<main class="stack">
  <article class="card">
    <span class="badge" th:text="${inquiry.status.label}">상태</span>
    <h2 th:text="${inquiry.title}">제목</h2>
    <p style="white-space:pre-wrap;" th:text="${inquiry.body}">내용</p>
    <p class="meta" th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</p>
  </article>
  <section class="card" th:each="reply : ${replies}">
    <strong th:text="${reply.author != null ? reply.author.name : '관리자'}">관리자</strong>
    <p style="white-space:pre-wrap;" th:text="${reply.body}">답변</p>
    <p class="meta" th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</p>
  </section>
  <div class="empty" th:if="${#lists.isEmpty(replies)}">
    <strong>아직 답변이 없어요.</strong>
    답변이 등록되면 이 화면과 알림에서 확인할 수 있습니다.
  </div>
</main>
</body>
</html>
