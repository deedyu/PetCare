<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('반려동물', '건강 기록은 반려동물마다 따로 있습니다.', 'pets', ~{::main})}">
<body>
<main>
  <div class="banner error" th:if="${error}" th:text="${error}">오류</div>
  <div class="banner ok" th:if="${success}" th:text="${success}">저장</div>
  <div class="page-actions">
    <a class="btn btn-primary" href="/pets/new">반려동물 등록</a>
  </div>
  <div class="pet-grid" th:if="${!#lists.isEmpty(pets)}" id="health">
    <article class="card" th:each="pet : ${pets}">
      <div class="pet-card">
        <span th:replace="~{fragments/pet-mark :: mark(${pet}, 'lg')}"></span>
        <div>
          <strong th:text="${pet.name}">이름</strong>
          <div class="meta">
            <span th:text="${pet.type}">종류</span>
            · <span th:text="${pet.age} + '세'">나이</span>
          </div>
          <div class="meta" th:if="${pet.family != null}" th:text="'가족 ' + ${pet.family.name}">가족</div>
        </div>
      </div>
      <div class="row-actions" style="margin-top:12px;">
        <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/tasks'}">일정</a>
        <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health'}">건강 기록</a>
        <a class="btn" th:if="${pet.user != null and user != null and pet.user.id == user.id}"
           th:href="@{/pets/{id}/edit(id=${pet.id})}">수정</a>
      </div>
      <form th:if="${pet.user != null and user != null and pet.user.id == user.id}"
            th:action="@{'/mypage/pets/' + ${pet.id} + '/delete'}" method="post" style="margin-top:8px;"
            onsubmit="return confirm('이 반려동물과 연결된 일정, 건강 기록이 삭제됩니다. 계속할까요?');">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-danger" type="submit">삭제</button>
      </form>
    </article>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(pets)}">
    <strong>아직 등록된 반려동물이 없어요.</strong>
    이름, 종류, 나이를 입력하면 일정과 건강 기록을 시작할 수 있습니다.
    <div style="margin-top:10px;"><a class="btn btn-primary" href="/pets/new">반려동물 등록하기</a></div>
  </div>
</main>
</body>
</html>
