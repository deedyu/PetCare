<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-shell :: layout('문의 답변', '문의 내용을 읽고 상태와 답변을 저장합니다.', 'inquiries', ~{::main})}">
<body>
<main>
  <p><a href="/admin/inquiries">문의 목록</a></p>
  <section class="card" style="margin-bottom:12px;">
    <div class="kpi-top">
      <h2 style="margin:0;" th:text="${inquiry.title}">제목</h2>
      <span class="badge"
            th:classappend="${inquiry.status.name() == 'ANSWERED'} ? ' badge-ok' : (${inquiry.status.name() == 'IN_PROGRESS'} ? ' badge-progress' : ' badge-wait')"
            th:text="${inquiry.status.label}">접수</span>
    </div>
    <p class="hint" th:text="${(inquiry.author != null ? inquiry.author.name : '작성자 없음') + ' · ' + #temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">작성자</p>
    <p th:text="${inquiry.body}" style="white-space:pre-wrap;">내용</p>
  </section>
  <section class="card" th:each="reply : ${replies}" style="margin-bottom:12px;">
    <strong th:text="${reply.author != null ? reply.author.name : '관리자'}">관리자</strong>
    <p th:text="${reply.body}" style="white-space:pre-wrap;">답변</p>
  </section>
  <p class="empty" th:if="${#lists.isEmpty(replies)}">아직 답변이 없습니다.</p>
  <section class="card compose">
    <h2>상태</h2>
    <form class="inline-form" th:action="@{'/admin/inquiries/' + ${inquiry.id} + '/status'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <select class="select" name="status" aria-label="문의 상태">
        <option value="OPEN" th:selected="${inquiry.status.name() == 'OPEN'}">접수</option>
        <option value="IN_PROGRESS" th:selected="${inquiry.status.name() == 'IN_PROGRESS'}">처리 중</option>
        <option value="ANSWERED" th:selected="${inquiry.status.name() == 'ANSWERED'}">답변 완료</option>
      </select>
      <button class="btn" type="submit">상태 저장</button>
    </form>
  </section>
  <section class="card compose">
    <h2>답변</h2>
    <p class="alert" th:if="${param.error}">답변 내용을 입력하세요.</p>
    <form th:action="@{'/admin/inquiries/' + ${inquiry.id} + '/reply'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <p><textarea class="field" name="body" maxlength="2000" rows="4" required placeholder="답변 내용" aria-label="답변 내용"></textarea></p>
      <button class="btn btn-primary" type="submit">답변 등록</button>
    </form>
  </section>
</main>
</body>
</html>
