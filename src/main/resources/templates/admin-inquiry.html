<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>문의 답변 - 관리자</title>
  <style>
    * { box-sizing: border-box; }
    @media (max-width: 768px) { .wrap { margin: 12px; padding: 16px; } }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6f7f4; margin: 0; color: #243027; }
    .wrap { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; }
    a { color: #3d7a4a; }
    .card { border: 1px solid #e4e8e1; border-radius: 12px; padding: 16px; margin: 12px 0; }
    textarea, select, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #d5ddd4; }
    textarea { width: 100%; box-sizing: border-box; }
    button { background: #3d7a4a; color: white; border: 0; cursor: pointer; }
    .error { color: #b42318; }
    p { white-space: pre-wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <p><a href="/admin/inquiries">문의 목록</a></p>
  <h1 th:text="${inquiry.title}">제목</h1>
  <p th:text="${inquiry.status.label}">상태</p>
  <p th:text="${inquiry.author != null ? inquiry.author.name : '작성자 없음'}">작성자</p>
  <p th:text="${inquiry.body}">내용</p>

  <div class="card" th:each="reply : ${replies}">
    <strong th:text="${reply.author != null ? reply.author.name : '관리자'}">관리자</strong>
    <p th:text="${reply.body}">답변</p>
  </div>

  <form th:action="@{'/admin/inquiries/' + ${inquiry.id} + '/status'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <select name="status">
      <option value="OPEN" th:selected="${inquiry.status.name() == 'OPEN'}">접수</option>
      <option value="IN_PROGRESS" th:selected="${inquiry.status.name() == 'IN_PROGRESS'}">처리 중</option>
      <option value="ANSWERED" th:selected="${inquiry.status.name() == 'ANSWERED'}">답변 완료</option>
    </select>
    <button type="submit">상태 저장</button>
  </form>

  <p class="error" th:if="${param.error}">답변 내용을 입력하세요.</p>
  <form th:action="@{'/admin/inquiries/' + ${inquiry.id} + '/reply'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <p><textarea name="body" maxlength="2000" rows="4" required placeholder="답변"></textarea></p>
    <button type="submit">답변 등록</button>
  </form>
</div>
</body>
</html>
