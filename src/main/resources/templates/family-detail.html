<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout(${family.name}, '구성원, 초대, 공유 반려동물을 관리합니다.', 'family', ~{::main})}">
<body>
<main class="stack">
  <p class="meta" th:if="${family.description != null}" th:text="${family.description}">설명</p>
  <div class="banner error" th:if="${error}" th:text="${error}">오류</div>

  <section class="card">
    <h2>구성원</h2>
    <ul class="list">
      <li th:each="member : ${members}">
        <div>
          <strong th:text="${member.name}">이름</strong>
          <span class="badge" th:text="${member.role.name() == 'OWNER'} ? '소유자' : '구성원'">역할</span>
        </div>
        <form th:if="${owner and member.role.name() != 'OWNER'}"
              th:action="@{'/family/' + ${family.id} + '/members/' + ${member.userId} + '/remove'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-danger" type="submit">내보내기</button>
        </form>
      </li>
    </ul>
  </section>

  <section class="card" th:if="${owner}">
    <h2>초대</h2>
    <form th:action="@{'/family/' + ${family.id} + '/invite'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-primary" type="submit">초대 코드 만들기</button>
    </form>
    <ul class="list" th:if="${!#lists.isEmpty(invites)}">
      <li th:each="invite : ${invites}">
        <div>
          <code th:text="${invite.code}">CODE</code>
          <div class="meta" th:text="'만료 ' + ${#temporals.format(invite.expiresAt, 'yyyy-MM-dd HH:mm')}">만료</div>
        </div>
      </li>
    </ul>
    <p class="meta" th:if="${#lists.isEmpty(invites)}">열려 있는 초대가 없습니다.</p>
  </section>

  <section class="card">
    <h2>공유 반려동물</h2>
    <ul class="list" th:if="${!#lists.isEmpty(sharedPets)}">
      <li th:each="pet : ${sharedPets}">
        <div class="pet-inline">
          <span th:replace="~{fragments/pet-mark :: mark(${pet}, 'sm')}"></span>
          <div>
            <strong th:text="${pet.name}">이름</strong>
            <div class="meta" th:text="${pet.type}">종류</div>
          </div>
        </div>
        <div class="row-actions">
          <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/tasks'}">일정</a>
          <form th:if="${owner or (pet.user != null and pet.user.id == user.id)}"
                th:action="@{'/family/' + ${family.id} + '/unshare'}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="petId" th:value="${pet.id}">
            <button class="btn" type="submit">공유 해제</button>
          </form>
        </div>
      </li>
    </ul>
    <div class="empty" th:if="${#lists.isEmpty(sharedPets)}">
      <strong>아직 공유된 반려동물이 없어요.</strong>
      아래에서 내 반려동물을 가족에게 공유할 수 있습니다.
    </div>
    <form class="inline-form" style="margin-top:12px;" th:if="${!#lists.isEmpty(shareablePets)}" th:action="@{'/family/' + ${family.id} + '/share'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <select class="select" name="petId">
        <option th:each="pet : ${shareablePets}" th:value="${pet.id}" th:text="${pet.name}">이름</option>
      </select>
      <button class="btn btn-primary" type="submit">공유</button>
    </form>
  </section>

  <section class="card">
    <h2>최근 활동</h2>
    <ul class="list" th:if="${!#lists.isEmpty(activities)}">
      <li th:each="log : ${activities}">
        <div>
          <div th:text="${log.summary}">내용</div>
          <div class="meta" th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm')}">시간</div>
        </div>
      </li>
    </ul>
    <p class="meta" th:if="${#lists.isEmpty(activities)}">아직 기록이 없습니다.</p>
  </section>

  <form th:if="${!owner}" th:action="@{'/family/' + ${family.id} + '/leave'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button class="btn" type="submit">가족 나가기</button>
  </form>
  <form th:if="${owner}" th:action="@{'/family/' + ${family.id} + '/delete'}" method="post" onsubmit="return confirm('다른 구성원이 있으면 삭제할 수 없습니다. 이 가족을 삭제할까요?');">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button class="btn btn-danger" type="submit">가족 삭제</button>
  </form>
</main>
</body>
</html>
