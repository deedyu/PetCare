<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('건강 기록 등록', '기록 종류에 맞는 항목만 입력합니다.', 'health', ~{::main})}">
<body>
<main>
  <h2 style="margin-top:0;" th:text="${recordType == 'WEIGHT' ? '체중 기록' : (recordType == 'VACCINATION' ? '예방접종' : (recordType == 'HOSPITAL' ? '병원 방문' : '복용 약'))}">기록</h2>
  <form class="card form-grid" th:action="@{'/pets/' + ${pet.id} + '/health'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="recordType" th:value="${recordType}">
    <label class="block">제목
      <input class="field" type="text" name="title" required>
    </label>
    <label class="block">날짜
      <input class="field" type="date" name="recordDate" th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" required>
    </label>
    <label class="block type-specific" th:classappend="${recordType == 'WEIGHT'} ? ' active'">체중 (kg)
      <input class="field" type="number" name="weight" step="0.1" min="0">
    </label>
    <label class="block type-specific" th:classappend="${recordType == 'VACCINATION'} ? ' active'">예방접종 종류
      <input class="field" type="text" name="vaccinationType">
    </label>
    <label class="block type-specific" th:classappend="${recordType == 'VACCINATION'} ? ' active'">다음 접종일
      <input class="field" type="date" name="nextDueDate">
    </label>
    <label class="block type-specific" th:classappend="${recordType == 'HOSPITAL'} ? ' active'">병원 이름
      <input class="field" type="text" name="hospitalName">
    </label>
    <label class="block type-specific" th:classappend="${recordType == 'MEDICATION'} ? ' active'">약 이름
      <input class="field" type="text" name="medicationName">
    </label>
    <label class="block type-specific" th:classappend="${recordType == 'MEDICATION'} ? ' active'">복용량
      <input class="field" type="text" name="medicationDosage">
    </label>
    <label class="block">상세 설명
      <textarea class="field" name="description"></textarea>
    </label>
    <div class="row-actions">
      <button class="btn btn-primary" type="submit">등록</button>
      <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health'}">취소</a>
    </div>
  </form>
</main>
</body>
</html>
