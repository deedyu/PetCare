<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('건강 기록', '체중, 예방접종, 병원, 복용 약을 반려동물별로 봅니다.', 'health', ~{::main})}">
<body>
<main>
  <div class="pet-inline" style="margin-bottom:12px;">
    <span th:replace="~{fragments/pet-mark :: mark(${pet}, 'lg')}"></span>
    <div>
      <strong th:text="${pet.name}">이름</strong>
      <div class="meta" th:text="${pet.type} + ' · ' + ${pet.age} + '세'">반려동물</div>
    </div>
  </div>
  <div class="page-actions">
    <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health/new?type=WEIGHT'}">체중</a>
    <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health/new?type=VACCINATION'}">예방접종</a>
    <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health/new?type=HOSPITAL'}">병원 방문</a>
    <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/health/new?type=MEDICATION'}">복용 약</a>
    <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/tasks'}">일정</a>
  </div>

  <section class="card section" th:if="${!#lists.isEmpty(overdueVaccines) or !#lists.isEmpty(upcomingVaccines)}">
    <h2>접종 일정</h2>
    <div class="task-row" th:each="record : ${overdueVaccines}">
      <div>
        <span class="badge high">지남</span>
        <strong th:text="${record.title}">접종</strong>
        <div class="meta"><span th:text="${record.nextDueDate}">날짜</span> <span th:text="${record.vaccinationType}">종류</span></div>
      </div>
    </div>
    <div class="task-row" th:each="record : ${upcomingVaccines}">
      <div>
        <span class="badge ok">예정</span>
        <strong th:text="${record.title}">접종</strong>
        <div class="meta"><span th:text="${record.nextDueDate}">날짜</span> <span th:text="${record.vaccinationType}">종류</span></div>
      </div>
    </div>
  </section>

  <section class="card section">
    <h2>체중</h2>
    <div th:if="${weightChart != null}">
      <svg class="chart" viewBox="0 0 320 140" role="img" aria-label="체중 변화">
        <polyline th:attr="points=${weightChart.polyline}" fill="none" stroke="#17663f" stroke-width="2"></polyline>
        <circle th:each="point : ${weightChart.points}" th:cx="${point.x}" th:cy="${point.y}" r="3.5" fill="#17663f"></circle>
      </svg>
      <div class="meta" th:each="point : ${weightChart.points}">
        <span th:text="${point.date}">날짜</span> <span th:text="${point.weight} + 'kg'">kg</span>
      </div>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(weightRecords)}">
      <strong>체중 기록이 없어요.</strong>
      측정한 체중을 남기면 변화를 볼 수 있습니다.
    </div>
    <div th:replace="~{fragments/health-record-list :: recordList(${weightRecords})}"></div>
  </section>

  <section class="card section">
    <h2>예방접종</h2>
    <div class="empty" th:if="${#lists.isEmpty(vaccinationRecords)}"><strong>예방접종 기록이 없어요.</strong></div>
    <div th:replace="~{fragments/health-record-list :: recordList(${vaccinationRecords})}"></div>
  </section>
  <section class="card section">
    <h2>병원 방문</h2>
    <div class="empty" th:if="${#lists.isEmpty(hospitalRecords)}"><strong>병원 방문 기록이 없어요.</strong></div>
    <div th:replace="~{fragments/health-record-list :: recordList(${hospitalRecords})}"></div>
  </section>
  <section class="card section">
    <h2>복용 약</h2>
    <div class="empty" th:if="${#lists.isEmpty(medicationRecords)}"><strong>복용 약 기록이 없어요.</strong></div>
    <div th:replace="~{fragments/health-record-list :: recordList(${medicationRecords})}"></div>
  </section>
</main>
</body>
</html>
