<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - PetCare</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; }
        .login-card { width: min(400px, calc(100% - 32px)); }
        .login-card h1 { margin: 0 0 4px; font-size: 22px; }
        .login-card form { display: grid; gap: 12px; margin-top: 16px; }
        .login-card label { display: grid; gap: 6px; font-size: 13px; font-weight: 650; }
        .login-card input { height: 40px; line-height: 38px; width: 100%; min-width: 0; }
        .login-card .btn { height: 40px; width: 100%; }
    </style>
</head>
<body>
<main class="card login-card">
    <div class="brand" style="padding:0 0 8px;">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div>
            <strong>PetCare 관리자</strong>
            <span>운영 계정으로 로그인</span>
        </div>
    </div>
    <h1>관리자 로그인</h1>
    <p class="hint">주소로 직접 들어온 관리자 전용 화면입니다.</p>
    <p class="alert" th:if="${param.suspended}">정지된 계정입니다.</p>
    <p class="alert" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="alert" th:if="${param.locked}">로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.</p>
    <p class="alert" th:if="${param.denied}">관리자 계정이 아닙니다.</p>
    <p class="alert" th:if="${error}" th:text="${error}"></p>
    <form action="/login" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="from" value="admin"/>
        <label>관리자 아이디
            <input class="field" type="text" id="username" name="username" required autofocus>
        </label>
        <label>비밀번호
            <input class="field" type="password" id="password" name="password" required>
        </label>
        <button class="btn btn-primary" type="submit">로그인</button>
    </form>
    <p class="hint" style="margin-top:16px;"><a href="/login">일반 사용자 로그인</a></p>
</main>
</body>
</html>
