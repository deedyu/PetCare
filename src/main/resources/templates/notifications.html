<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>알림 - PetCare</title>
  <style>
    * { box-sizing: border-box; }
    @media (max-width: 768px) { .wrap { margin: 12px; padding: 16px; } }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6f7f4; margin: 0; color: #243027; }
    .wrap { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; }
    a { color: #3d7a4a; }
    .card { border: 1px solid #e4e8e1; border-radius: 12px; padding: 16px; margin: 12px 0; }
    .unread { background: #fff8e1; }
    button { background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; text-align: left; padding: 0; }
    .meta { color: #667; font-size: 13px; }
    form.inline { display: inline; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>알림</h1>
  <p><a href="/">홈으로</a></p>
  <p class="meta">일정에 미리 알림을 켜 두면, 그 시각이 지난 뒤 여기에 모입니다.</p>
  <form th:if="${unread > 0}" th:action="@{/notifications/read-all}" method="post" class="inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" style="color:#3d7a4a;">모두 읽음</button>
  </form>
    <div th:each="notice : ${notifications}" class="card" th:classappend="${notice.readAt == null ? 'unread' : ''}">
    <form th:action="@{'/notifications/' + ${notice.id} + '/open'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">
        <strong th:text="${notice.type.label}">일정</strong>
        <strong th:text="${notice.title}">제목</strong>
        <div th:text="${notice.body}">내용</div>
      </button>
    </form>
  </div>
  <p th:if="${#lists.isEmpty(notifications)}">새 알림이 없습니다.</p>
</div>
</body>
</html>
