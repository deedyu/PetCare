<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('알림', '일정 알림과 문의 답변을 확인합니다.', 'notifications', ~{::main})}">
<body>
<main>
  <p class="meta">일정에 미리 알림을 켜 두면, 그 시각이 지난 뒤 여기에 모입니다.</p>
  <form th:if="${unread > 0}" th:action="@{/notifications/read-all}" method="post" style="margin-bottom:12px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button class="btn" type="submit">모두 읽음</button>
  </form>
  <div class="stack" th:if="${!#lists.isEmpty(notifications)}">
    <article class="card" th:each="notice : ${notifications}" th:classappend="${notice.readAt == null} ? ' unread'">
      <form th:action="@{'/notifications/' + ${notice.id} + '/open'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost" style="height:auto;padding:0;text-align:left;white-space:normal;">
          <span class="badge" th:text="${notice.readAt == null} ? '안 읽음' : '읽음'">읽음</span>
          <span class="badge" th:text="${notice.type.label}">일정</span>
          <strong th:text="${notice.title}">제목</strong>
          <div th:text="${notice.body}">내용</div>
          <div class="meta" th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</div>
        </button>
      </form>
    </article>
  </div>
  <div class="empty" th:if="${#lists.isEmpty(notifications)}">
    <strong>새 알림이 없어요.</strong>
    일정에 미리 알림을 켜 두면 이곳에 표시됩니다.
    <div style="margin-top:10px;"><a class="btn" href="/calendar">캘린더 보기</a></div>
  </div>
</main>
</body>
</html>
