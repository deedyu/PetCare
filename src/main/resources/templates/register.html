<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - PetCare</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <strong>PetCare</strong>
                <span>반려동물 일정</span>
            </div>
        </div>
        <h1>회원가입</h1>
        <p class="lead">표시된 항목은 모두 필수입니다. 이메일은 받지 않습니다.</p>

        <form id="registerForm" action="/register" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="name">이름
                <input class="field" type="text" id="name" name="name" required maxlength="30" autocomplete="nickname" th:value="${name}">
                <span class="field-error" th:if="${nameError}" th:text="${nameError}"></span>
            </label>
            <label for="username">아이디
                <span class="check-line">
                    <input class="field" type="text" id="username" name="username" required minlength="4" maxlength="20" autocomplete="username" th:value="${username}" pattern="[a-z0-9]{4,20}">
                    <button class="btn" type="button" id="checkUsername">중복 확인</button>
                </span>
                <span id="usernameStatus" class="hint">영문 소문자와 숫자 4~20자</span>
                <span class="field-error" th:if="${usernameError}" th:text="${usernameError}"></span>
            </label>
            <label for="password">비밀번호
                <span class="secret-line">
                    <input class="field" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                    <button class="btn" type="button" data-toggle-secret="password">표시</button>
                </span>
                <span class="hint">8자 이상, 영문과 숫자를 포함해야 합니다.</span>
                <span class="field-error" th:if="${passwordError}" th:text="${passwordError}"></span>
            </label>
            <label for="passwordConfirm">비밀번호 확인
                <span class="secret-line">
                    <input class="field" type="password" id="passwordConfirm" name="passwordConfirm" required minlength="8" autocomplete="new-password">
                    <button class="btn" type="button" data-toggle-secret="passwordConfirm">표시</button>
                </span>
                <span id="matchStatus"></span>
                <span class="field-error" th:if="${confirmError}" th:text="${confirmError}"></span>
            </label>
            <button class="btn btn-primary btn-block" type="submit">회원가입</button>
        </form>
        <div class="auth-links">
            <a href="/login">로그인으로 돌아가기</a>
        </div>
    </section>
</main>
<script src="/js/auth.js"></script>
</body>
</html>
