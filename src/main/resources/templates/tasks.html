<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('일정', '반복, 알림, 우선순위와 완료를 관리합니다.', 'pets', ~{::main})}">
<body>
<main class="stack">
  <div class="pet-inline">
    <span th:replace="~{fragments/pet-mark :: mark(${pet}, 'lg')}"></span>
    <div>
      <strong th:text="${pet.name}">이름</strong>
      <div class="meta" th:text="${pet.type} + ' · ' + ${pet.age} + '세'">일정</div>
    </div>
  </div>
  <form class="card form-grid" th:action="@{'/pets/' + ${pet.id} + '/tasks'}" method="post" id="taskForm" data-task-form>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label class="block">제목
      <input class="field" type="text" id="title" name="title" required placeholder="예: 산책, 사료, 약">
    </label>
    <label class="block">카테고리
      <select class="select" id="category" name="category">
        <option value="NONE">선택 안 함</option>
        <option th:each="c : ${categories}" th:value="${c.name}" th:text="${c.label}">식사</option>
      </select>
    </label>
    <label class="block">설명
      <input class="field" type="text" id="description" name="description" placeholder="메모">
    </label>
    <label class="block" th:if="${members != null and !#lists.isEmpty(members)}">담당자
      <select class="select" id="assigneeId" name="assigneeId">
        <option value="">미지정</option>
        <option th:each="m : ${members}" th:value="${m.userId}" th:text="${m.name}">이름</option>
      </select>
    </label>
    <label class="check-line"><input type="checkbox" id="dateToggle" checked> 날짜 지정</label>
    <input class="field" type="date" id="dueDate" name="dueDate">
    <label class="check-line"><input type="checkbox" id="timeToggle" checked> 시간 지정</label>
    <input class="field" type="time" id="dueTime" name="dueTime" value="09:00">
    <label class="block">반복
      <select class="select" id="repeatType" name="repeatType">
        <option value="NONE">안 함</option>
        <option value="DAILY">매일</option>
        <option value="WEEKLY">매주</option>
        <option value="MONTHLY">매월</option>
        <option value="WEEKDAYS">요일 지정</option>
      </select>
    </label>
    <div data-weekdays hidden>
      <span class="hint">요일 지정일 때 선택</span>
      <div class="row-actions">
        <label><input type="checkbox" name="weekdays" value="MON"> 월</label>
        <label><input type="checkbox" name="weekdays" value="TUE"> 화</label>
        <label><input type="checkbox" name="weekdays" value="WED"> 수</label>
        <label><input type="checkbox" name="weekdays" value="THU"> 목</label>
        <label><input type="checkbox" name="weekdays" value="FRI"> 금</label>
        <label><input type="checkbox" name="weekdays" value="SAT"> 토</label>
        <label><input type="checkbox" name="weekdays" value="SUN"> 일</label>
      </div>
    </div>
    <label class="block">미리 알림
      <select class="select" id="notificationTime" name="notificationTime">
        <option value="NONE">없음</option>
        <option value="ON_TIME">정시</option>
        <option value="10_MIN_BEFORE">10분 전</option>
        <option value="30_MIN_BEFORE">30분 전</option>
        <option value="1_HOUR_BEFORE">1시간 전</option>
      </select>
    </label>
    <label class="block">우선순위
      <select class="select" id="priority" name="priority">
        <option value="NONE">없음</option>
        <option value="HIGH">높음</option>
        <option value="MEDIUM">보통</option>
        <option value="LOW">낮음</option>
      </select>
    </label>
    <button class="btn btn-primary" type="submit">일정 추가</button>
  </form>

  <section class="card">
    <h2>일정 목록</h2>
    <form class="filters" method="get" th:action="@{'/pets/' + ${pet.id} + '/tasks'}">
      <input class="field" type="text" name="search" th:value="${search}" placeholder="검색" aria-label="검색">
      <select class="select" name="filter" onchange="this.form.submit()">
        <option value="all" th:selected="${filter == 'all'}">전체</option>
        <option value="incomplete" th:selected="${filter == 'incomplete'}">미완료</option>
        <option value="completed" th:selected="${filter == 'completed'}">완료</option>
      </select>
      <input class="field" type="date" name="on" th:value="${on}" onchange="this.form.submit()" aria-label="날짜">
      <select class="select" name="category" onchange="this.form.submit()">
        <option value="">카테고리 전체</option>
        <option th:each="c : ${categories}" th:value="${c.name}" th:text="${c.label}" th:selected="${category == c.name}">식사</option>
      </select>
      <select class="select" name="priority" onchange="this.form.submit()">
        <option value="">우선순위 전체</option>
        <option value="HIGH" th:selected="${priorityFilter == 'HIGH'}">높음</option>
        <option value="MEDIUM" th:selected="${priorityFilter == 'MEDIUM'}">보통</option>
        <option value="LOW" th:selected="${priorityFilter == 'LOW'}">낮음</option>
      </select>
      <select class="select" name="sort" onchange="this.form.submit()">
        <option value="" th:selected="${sort == ''}">최신순</option>
        <option value="date" th:selected="${sort == 'date'}">날짜순</option>
        <option value="priority" th:selected="${sort == 'priority'}">우선순위순</option>
        <option value="title" th:selected="${sort == 'title'}">제목순</option>
      </select>
    </form>
    <div class="empty" th:if="${#lists.isEmpty(tasks)}">
      <strong>조건에 맞는 일정이 없어요.</strong>
      위에서 일정을 추가하거나 필터를 바꿔 보세요.
    </div>
    <article class="task-row" th:each="t : ${tasks}">
      <form th:action="@{'/pets/' + ${pet.id} + '/tasks/' + ${t.id} + '/toggle'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="date" th:value="${t.viewDate}">
        <input type="hidden" name="returnTo" th:value="@{|/pets/${pet.id}/tasks?on=${on}&category=${category}&filter=${filter}|}">
        <input type="checkbox" th:checked="${t.doneOnView}" onchange="this.form.submit()" th:aria-label="${t.title}">
      </form>
      <div style="flex:1;">
        <div th:class="${t.doneOnView} ? 'done' : ''" th:text="${t.title}">제목</div>
        <div class="meta" th:if="${t.description != null}" th:text="${t.description}">설명</div>
        <div class="meta">
          <span th:if="${t.category != null}" th:text="${#lists.isEmpty(categories.?[name() == #root.t.category]) ? t.category : categories.?[name() == #root.t.category][0].label}">분류</span>
          <span th:if="${t.assignee != null}" th:text="'담당 ' + ${t.assignee.name}">담당</span>
          <span class="badge" th:if="${t.priority != null}"
                th:classappend="${t.priority == 'HIGH'} ? ' high' : (${t.priority == 'LOW'} ? ' low' : ' medium')"
                th:text="${t.priority == 'HIGH'} ? '높음' : (${t.priority == 'LOW'} ? '낮음' : '보통')">우선순위</span>
          <span th:if="${t.dueDate != null}" th:text="${t.dueDate}">날짜</span>
          <span th:if="${t.dueTime != null}" th:text="${t.dueTime}">시간</span>
          <span th:if="${t.repeatType != null}" th:text="${t.repeatType == 'DAILY'} ? '매일' : (${t.repeatType == 'WEEKLY'} ? '매주' : (${t.repeatType == 'WEEKDAYS'} ? '요일' : '매월'))">반복</span>
          <span th:if="${t.notificationTime != null}" th:text="${t.notificationTime == 'ON_TIME'} ? '정시' : (${t.notificationTime == '10_MIN_BEFORE'} ? '10분 전' : (${t.notificationTime == '30_MIN_BEFORE'} ? '30분 전' : '1시간 전'))">알림</span>
        </div>
      </div>
      <div class="row-actions">
        <a class="btn" th:href="@{'/pets/' + ${pet.id} + '/tasks/' + ${t.id} + '/edit'}">수정</a>
        <form th:action="@{'/pets/' + ${pet.id} + '/tasks/' + ${t.id} + '/delete'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-danger" type="submit">삭제</button>
        </form>
      </div>
    </article>
  </section>
</main>
</body>
</html>
