<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{fragments/app-shell :: layout('캘린더', '날짜를 고르면 그날의 일정이 아래에 나옵니다.', 'calendar', ~{::main})}">
<body>
<main>
  <div class="toolbar">
    <a class="btn" th:href="@{/calendar(view=${view}, date=${prev}, petId=${petId}, category=${category})}">이전</a>
    <strong th:text="${title}">2026년 10월</strong>
    <a class="btn" th:href="@{/calendar(view=${view}, date=${next}, petId=${petId}, category=${category})}">다음</a>
    <a class="btn" th:href="@{/calendar(view='month', date=${selected}, petId=${petId}, category=${category})}" th:classappend="${view == 'month'} ? ' btn-primary'">월</a>
    <a class="btn" th:href="@{/calendar(view='week', date=${selected}, petId=${petId}, category=${category})}" th:classappend="${view == 'week'} ? ' btn-primary'">주</a>
    <a class="btn" th:href="@{/calendar(view='day', date=${selected}, petId=${petId}, category=${category})}" th:classappend="${view == 'day'} ? ' btn-primary'">일</a>
    <a class="btn btn-primary" href="/pets">일정 추가</a>
  </div>

  <form class="filters" method="get" action="/calendar">
    <input type="hidden" name="view" th:value="${view}">
    <input type="hidden" name="date" th:value="${selected}">
    <label>반려동물
      <select class="select" name="petId" onchange="this.form.submit()">
        <option value="">전체</option>
        <option th:each="p : ${pets}" th:value="${p.id}" th:text="${p.name}" th:selected="${petId == p.id}">이름</option>
      </select>
    </label>
    <label>카테고리
      <select class="select" name="category" onchange="this.form.submit()">
        <option value="">전체</option>
        <option th:each="c : ${categories}" th:value="${c.name}" th:text="${c.label}" th:selected="${category == c.name}">식사</option>
      </select>
    </label>
  </form>

  <div class="cal-scroll" th:if="${view != 'day'}">
    <div class="weekdays"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
    <div class="month-grid">
      <div th:each="day : ${days}" class="day"
           th:classappend="${(day.inMonth ? '' : ' out') + (day.date.equals(#temporals.createToday()) ? ' is-today' : '') + (day.date.equals(selected) ? ' is-selected' : '') + (#lists.isEmpty(day.slots) ? '' : ' has-events')}">
        <a class="num" th:href="@{/calendar(view=${view}, date=${day.date}, petId=${petId}, category=${category})}" th:text="${day.date.dayOfMonth}">1</a>
        <a th:each="slot : ${day.slots}" class="slot"
           th:classappend="${(slot.done ? ' done' : '') + (slot.priority != null ? ' pri-' + slot.priority : '')}"
           th:href="@{/calendar(view=${view}, date=${day.date}, petId=${petId}, category=${category}, open=${slot.id})}">
          <span th:if="${slot.pet != null}" th:replace="~{fragments/pet-mark :: mark(${slot.pet}, 'sm')}"></span>
          <span class="slot-title" th:text="${(slot.dueTime != null ? #strings.substring(slot.dueTime.toString(), 0, 5) + ' ' : '') + slot.title}">산책</span>
        </a>
        <a th:if="${day.more > 0}" class="meta" th:href="@{/calendar(view='day', date=${day.date}, petId=${petId}, category=${category})}" th:text="'외 ' + ${day.more} + '개'">외 1개</a>
      </div>
    </div>
  </div>

  <section class="card section">
    <h2 th:text="${selected} + ' 일정'">선택한 날짜</h2>
    <div class="empty" th:if="${#lists.isEmpty(daySlots)}">
      <strong>이 날짜의 일정이 없어요.</strong>
      반려동물을 고른 뒤 일정을 추가할 수 있습니다.
      <div style="margin-top:10px;"><a class="btn" href="/pets">반려동물 보기</a></div>
    </div>
    <div class="task-row" th:each="slot : ${daySlots}">
      <div>
        <a th:href="@{/calendar(view='day', date=${selected}, petId=${petId}, category=${category}, open=${slot.id})}" th:text="${slot.title}">제목</a>
        <div class="meta">
          <span class="pet-inline" th:if="${slot.pet != null}">
            <span th:replace="~{fragments/pet-mark :: mark(${slot.pet}, 'sm')}"></span>
            <span th:text="${slot.pet.name}">반려동물</span>
          </span>
          <span th:if="${slot.dueTime != null}" th:text="${slot.dueTime}">시간</span>
          <span th:if="${slot.assigneeName != null}" th:text="'담당 ' + ${slot.assigneeName}">담당</span>
          <span class="badge ok" th:if="${slot.done}">완료</span>
          <span class="badge" th:if="${slot.priority != null}"
                th:classappend="${slot.priority == 'HIGH'} ? ' high' : (${slot.priority == 'LOW'} ? ' low' : ' medium')"
                th:text="${slot.priority == 'HIGH'} ? '높음' : (${slot.priority == 'LOW'} ? '낮음' : '보통')">우선순위</span>
        </div>
      </div>
    </div>
  </section>

  <section class="card section" th:if="${opened != null}">
    <h2 th:text="${opened.title}">일정</h2>
    <p class="meta pet-inline">
      <span th:if="${opened.pet != null}" th:replace="~{fragments/pet-mark :: mark(${opened.pet}, 'sm')}"></span>
      <span th:text="${opened.pet != null ? opened.pet.name : ''}">반려동물</span>
      <span th:text="${opened.occurrenceDate}">날짜</span>
      <span th:if="${opened.dueTime != null}" th:text="${opened.dueTime}">시간</span>
      <span th:if="${opened.repeatType != null}" th:text="${opened.repeatType}">반복</span>
    </p>
    <p th:if="${opened.done}">
      완료 <span th:text="${opened.completedByName != null ? opened.completedByName : '기록 없음'}">나</span>
      <span th:if="${opened.completedAt != null}" th:text="${#temporals.format(opened.completedAt, 'HH:mm')}">시간</span>
    </p>
    <form class="stack" th:action="@{/calendar/complete}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="taskId" th:value="${opened.id}">
      <input type="hidden" name="date" th:value="${opened.occurrenceDate}">
      <input type="hidden" name="done" th:value="${!opened.done}">
      <input type="hidden" name="returnTo" th:value="@{/calendar(view=${view}, date=${selected}, petId=${petId}, category=${category}, open=${opened.id})}">
      <label class="block">수행 메모
        <input class="field" type="text" name="memo" th:value="${opened.memo}" placeholder="실제로 한 일">
      </label>
      <button class="btn btn-primary" type="submit" th:text="${opened.done} ? '완료 취소' : '이 날짜 완료'">이 날짜 완료</button>
    </form>
    <p><a th:href="@{'/pets/' + ${opened.pet?.id} + '/tasks/' + ${opened.id} + '/edit'}">일정 수정</a></p>
  </section>
</main>
</body>
</html>
