<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-shell :: layout('공지사항 관리', '회원 홈 상단에 노출할 공지를 등록하고 고정합니다.', 'notices', ~{::main})}">
<body>
<main>
  <p class="alert" th:if="${param.error}">제목과 내용을 모두 입력해야 등록할 수 있습니다.</p>
  <section class="card compose">
    <h2>새 공지</h2>
    <form th:action="@{/admin/notices}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <p><input class="field" type="text" name="title" maxlength="120" required placeholder="제목" aria-label="공지 제목" style="width:100%"></p>
      <p><textarea class="field" name="body" maxlength="2000" rows="4" required placeholder="내용" aria-label="공지 내용"></textarea></p>
      <p class="check"><label><input type="checkbox" name="pinned"> 회원 홈 상단에 고정</label></p>
      <button class="btn btn-primary" type="submit">공지 등록</button>
    </form>
  </section>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>제목</th><th>작성자</th><th>작성일</th><th>게시 상태</th><th>관리</th></tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(notices)}"><td colspan="5" class="empty">등록된 공지가 없습니다.</td></tr>
        <tr th:each="notice : ${notices}">
          <td>
            <strong th:text="${notice.title}">제목</strong>
            <p class="hint" th:text="${notice.body}">내용</p>
          </td>
          <td th:text="${notice.author != null ? notice.author.name : '관리자'}">관리자</td>
          <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
          <td><span class="badge" th:classappend="${notice.pinned} ? ' badge-ok' : ''" th:text="${notice.pinned} ? '고정' : '일반'">일반</span></td>
          <td>
            <div class="actions">
              <form th:action="@{'/admin/notices/' + ${notice.id} + '/pin'}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="pinned" th:value="${!notice.pinned}">
                <button class="btn" type="submit" th:text="${notice.pinned} ? '고정 해제' : '고정'">고정</button>
              </form>
              <form th:action="@{'/admin/notices/' + ${notice.id} + '/delete'}" method="post" data-confirm="이 공지를 삭제합니다. 계속할까요?">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-danger" type="submit">삭제</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
