<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>공지 - 관리자</title>
  <style>
    * { box-sizing: border-box; }
    @media (max-width: 768px) { .wrap { margin: 12px; padding: 16px; } }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6f7f4; margin: 0; color: #243027; }
    .wrap { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; }
    a { color: #3d7a4a; margin-right: 12px; }
    .card { border: 1px solid #e4e8e1; border-radius: 12px; padding: 16px; margin: 12px 0; }
    input, textarea, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #d5ddd4; }
    textarea { width: 100%; box-sizing: border-box; }
    button { background: #3d7a4a; color: white; border: 0; cursor: pointer; }
    .error { color: #b42318; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>공지</h1>
  <p>
    <a href="/admin">회원</a>
    <a href="/admin/inquiries">문의</a>
  </p>
  <p class="error" th:if="${param.error}">제목과 내용을 입력하세요.</p>

  <div class="card">
    <h2>새 공지</h2>
    <form th:action="@{/admin/notices}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <p><input type="text" name="title" maxlength="120" required placeholder="제목"></p>
      <p><textarea name="body" maxlength="2000" rows="4" required placeholder="내용"></textarea></p>
      <p class="row"><label><input type="checkbox" name="pinned"> 상단에 고정</label></p>
      <button type="submit">등록</button>
    </form>
  </div>

  <div class="card" th:each="notice : ${notices}">
    <strong th:if="${notice.pinned}">고정</strong>
    <strong th:text="${notice.title}">제목</strong>
    <p th:text="${notice.body}">내용</p>
    <p th:text="${notice.author != null ? notice.author.name : '관리자'}">작성자</p>
    <div class="row">
      <form th:action="@{'/admin/notices/' + ${notice.id} + '/pin'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="pinned" th:value="${!notice.pinned}">
        <button type="submit" th:text="${notice.pinned} ? '고정 해제' : '고정'">고정</button>
      </form>
      <form th:action="@{'/admin/notices/' + ${notice.id} + '/delete'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">삭제</button>
      </form>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(notices)}">등록된 공지가 없습니다.</p>
</div>
</body>
</html>
