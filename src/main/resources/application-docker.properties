# Docker 환경용 설정
spring.application.name=petcare-service

# Docker Compose가 환경 변수로 넣습니다. 이 파일에는 비밀번호를 적지 않습니다.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 서버 포트
server.port=8081
server.tomcat.max-http-form-post-size=6MB
server.tomcat.max-swallow-size=6MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 컨테이너 안 임시 폴더가 아니라 볼륨으로 마운트할 경로. PETCARE_PHOTO_DIR 로 바꿀 수 있다.
petcare.photos.directory=${PETCARE_PHOTO_DIR:/var/petcare/photos}

# 세션 쿠키는 브라우저를 닫으면 사라진다. HTTPS에서는 PETCARE_COOKIE_SECURE=true 로 둔다.
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${PETCARE_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

petcare.session.idle-seconds=1800
petcare.remember.days=30
petcare.remember.key=${PETCARE_REMEMBER_KEY:petcare-local-remember-key}

petcare.login.max-attempts=5
petcare.login.window-seconds=900



