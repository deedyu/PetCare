spring.application.name=petcare-service

# 값은 환경 변수 또는 프로젝트 루트의 .env 에서 읽습니다. 이 파일에는 비밀번호를 적지 않습니다.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
server.tomcat.max-http-form-post-size=6MB
server.tomcat.max-swallow-size=6MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 사진 파일은 프로젝트와 컨테이너 임시 폴더 밖에 둔다. 배포 시 PETCARE_PHOTO_DIR 에 영구 볼륨을 붙인다.
petcare.photos.directory=${PETCARE_PHOTO_DIR:${user.home}/petcare-data/photos}

# 세션 쿠키는 브라우저를 닫으면 사라진다. 30일 유지는 PETCARE_REMEMBER 쿠키만 담당한다.
# 컨테이너 세션은 12시간까지 남겨, 화면이 열린 채 30분이 지난 경우를 서버가 구분한다.
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${PETCARE_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# 열린 화면에서 실제 사용이 없으면 로그아웃한다. 알림 조회 같은 백그라운드 요청은 활동으로 치지 않는다.
petcare.session.idle-seconds=1800
petcare.remember.days=30
petcare.remember.key=${PETCARE_REMEMBER_KEY:petcare-local-remember-key}

# 같은 아이디로 15분에 5번 실패하면 15분 동안 로그인만 막는다. 계정은 지우지 않는다.
petcare.login.max-attempts=5
petcare.login.window-seconds=900

# admin 계정이 없을 때만 사용합니다. 이미 있는 비밀번호 해시는 바꾸지 않습니다.
petcare.admin.initial-password=${PETCARE_ADMIN_INITIAL_PASSWORD:}

# ngrok을 통한 HTTPS 접속 지원
server.forward-headers-strategy=framework
server.use-forward-headers=true
