spring.application.name=petcare-service

# 값은 환경 변수 또는 프로젝트 루트의 .env 에서 읽습니다. 이 파일에는 비밀번호를 적지 않습니다.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# 세션 설정
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=1800

# 같은 아이디로 15분에 5번 실패하면 15분 동안 로그인만 막는다. 계정은 지우지 않는다.
petcare.login.max-attempts=5
petcare.login.window-seconds=900

# admin 계정이 없을 때만 사용합니다. 이미 있는 비밀번호 해시는 바꾸지 않습니다.
petcare.admin.initial-password=${PETCARE_ADMIN_INITIAL_PASSWORD:}

# ngrok을 통한 HTTPS 접속 지원
server.forward-headers-strategy=framework
server.use-forward-headers=true
