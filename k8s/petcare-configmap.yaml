apiVersion: v1
kind: ConfigMap
metadata:
  name: petcare-config
  namespace: petcare
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/petcare?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SERVER_PORT: "8081"
  TZ: "Asia/Seoul"



