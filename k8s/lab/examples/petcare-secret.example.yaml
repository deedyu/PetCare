# 예시 파일이다. kubectl apply 하지 않는다.
# 실제 값은 Git 에 올리지 않는 .env.k8s.lab 에서 Secret 으로 만든다.
apiVersion: v1
kind: Secret
metadata:
  name: petcare-lab-app-secret
  namespace: petcare-lab
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "petcare_lab"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  PETCARE_ADMIN_INITIAL_PASSWORD: "REPLACE_ME"
