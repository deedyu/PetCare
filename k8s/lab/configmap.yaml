# 비밀번호가 아닌 연결 설정만 담는다.
# mysql 이라는 호스트 이름은 이 Namespace 안의 Service 이름이다.
# 기존 petcare Namespace 의 MySQL 과는 연결되지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: petcare-lab-config
  namespace: petcare-lab
  labels:
    app.kubernetes.io/part-of: petcare-lab
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/petcare_lab?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  SERVER_PORT: "8081"
  TZ: "Asia/Seoul"
  MYSQL_DATABASE: "petcare_lab"
