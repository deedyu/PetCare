# ClusterIP 는 클러스터 안에서만 열린다. 호스트의 3306, 3307, 3308 은 사용하지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: petcare-lab
  labels:
    app: mysql
    app.kubernetes.io/part-of: petcare-lab
spec:
  type: ClusterIP
  selector:
    app: mysql
    app.kubernetes.io/part-of: petcare-lab
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
