apiVersion: v1
kind: Service
metadata:
  name: petcare-service
  namespace: petcare
  labels:
    app: petcare-app
spec:
  type: LoadBalancer  # 외부 접근을 위한 LoadBalancer 타입
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: petcare-app
  sessionAffinity: ClientIP  # 세션 유지를 위한 설정

