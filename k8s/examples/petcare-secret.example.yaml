# 이 파일은 예시입니다. kubectl apply 하지 마세요.
# 실제 Secret 은 k8s/create-secrets.sh 가 환경 변수로 만듭니다.
apiVersion: v1
kind: Secret
metadata:
  name: petcare-secret
  namespace: petcare
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "REPLACE_ME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  PETCARE_ADMIN_INITIAL_PASSWORD: "REPLACE_ME"
